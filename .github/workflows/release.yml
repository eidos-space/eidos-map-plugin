name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: map-plugin
          path: dist/
      - name: Publish tagged prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.eidos-plugin dist/SHA256SUMS --verify-tag --prerelease --title "Map $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
